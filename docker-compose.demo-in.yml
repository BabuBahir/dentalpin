# demo.dentalpin.in — Coolify + Docker deployment of the
# feat/payment-gateways-razorpay branch.
#
# Same shape as upstream docker-compose.prod.yml (Caddy fronts both
# services on ONE origin, so there is no CORS and no second subdomain),
# but built from this branch's source instead of prebuilt GHCR images,
# because the Razorpay module only exists on this branch.
#
# TLS is terminated by Coolify's own proxy (Traefik) in front of the
# `caddy` service, so Caddy itself listens on plain :80 inside the
# network — that is what PUBLIC_URL=:80 does to the repo Caddyfile,
# whose site address is `{$PUBLIC_URL:http://localhost}`.
#
# In Coolify: Docker Compose resource → this file → set the domain on
# the `caddy` service to https://demo.dentalpin.in

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dental_clinic}
      POSTGRES_USER: ${POSTGRES_USER:-dental}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Coolify}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dental} -d ${POSTGRES_DB:-dental_clinic}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dental}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-dental_clinic}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in Coolify}
      BUDGET_PUBLIC_SECRET_KEY: ${BUDGET_PUBLIC_SECRET_KEY:-}
      ENVIRONMENT: production
      # Same origin as the browser, so this is only a belt-and-braces value.
      ALLOWED_ORIGINS: ${PUBLIC_URL:-https://demo.dentalpin.in}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage
      # AI Copilot — leave empty and the app runs, the assistant does not.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Demo seeding. SEED_COUNTRY needs the docker-entrypoint.sh patch
      # that ships alongside this file — upstream's entrypoint passes
      # only --lang, which would give you English-generic, not India GST.
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-1}
      SEED_LANG: ${SEED_LANG:-en}
      SEED_COUNTRY: ${SEED_COUNTRY:-in}
    volumes:
      - storage_data:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        # Baked default for runtimeConfig.public.apiBaseUrl; the env var
        # below overrides it at boot anyway. Same origin => just the host.
        API_BASE_URL: ${PUBLIC_URL:-https://demo.dentalpin.in}
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${PUBLIC_URL:-https://demo.dentalpin.in}
      API_BASE_URL_SERVER: http://backend:8000
      # Demo banner + the admin@demo.clinic / demo1234 hint on the login
      # page, exactly like demo.dentalpin.com.
      NUXT_PUBLIC_DEMO_MODE: ${NUXT_PUBLIC_DEMO_MODE:-true}
      NUXT_PUBLIC_DOCS_URL: ${DOCS_URL:-https://docs.dentalpin.com}
      NUXT_CSP_MODE: ${NUXT_CSP_MODE:-report}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      # Tells Coolify which service+port to publish. Set the value to
      # https://demo.dentalpin.in in the Coolify environment editor.
      SERVICE_FQDN_CADDY_80: ${PUBLIC_URL:-https://demo.dentalpin.in}
    volumes:
      # Caddyfile.demo-in is upstream's Caddyfile with the site address
      # hardcoded to :80 — plain HTTP inside the Docker network, because
      # Coolify's proxy owns 80/443 on the host and terminates TLS.
      - ./Caddyfile.demo-in:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    expose:
      - "80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  storage_data:
  caddy_data:
  caddy_config:
